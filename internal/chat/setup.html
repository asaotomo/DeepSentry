<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSentry · 连接通讯工具</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#162747;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:48px auto;padding:0 28px}.brand{font-weight:750;letter-spacing:.12em;font-size:14px;color:#3865ed;margin-bottom:28px}.hero{border-radius:24px;padding:38px;background:linear-gradient(115deg,#e9f2ff,#e8f9f5);margin-bottom:28px}h1{margin:0 0 14px;font-size:32px}p{color:#738099;line-height:1.7;margin:8px 0}article{display:flex;align-items:center;gap:22px;background:white;border:1px solid #e3e9f2;border-radius:18px;padding:26px;margin:16px 0}.icon{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:22px;font-weight:750;background:#edf3ff;color:#3765ea}.info{flex:1}h2{font-size:20px;margin:0 0 5px}article p{font-size:14px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 20px;font:inherit;background:#3865ee;color:#fff;font-weight:600}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eef2f8;color:#5b6781}.badge{font-size:13px;border-radius:20px;padding:7px 12px;background:#eef2f8;color:#74809a}.connected{background:#e9f9f2;color:#188761}footer{font-size:13px;color:#8390a7;margin:26px 2px}dialog{border:1px solid #e6eaf0;border-radius:22px;padding:36px;width:min(520px,94vw);box-shadow:0 25px 90px #182c4833;color:inherit;text-align:center}dialog::backdrop{background:#14223980;backdrop-filter:blur(3px)}.close{position:absolute;right:16px;top:12px;background:transparent;color:#7b859a;font-size:25px;padding:5px 10px}.mark{margin:0 auto 18px;background:#edf3ff;border-radius:15px;width:60px;height:60px;display:grid;place-items:center;font-size:26px;color:#3865ee}.tabs{display:flex;justify-content:center;gap:12px;margin:24px 0}.tabs button{font-size:14px}.tabs .active{background:#3865ee;color:white}#qr{width:280px;height:280px;max-width:100%;image-rendering:pixelated}.hidden{display:none!important}.consent{text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:13px;background:#f5f7fc;border-radius:10px;padding:14px;color:#68758c;margin:18px 0}.consent input{margin-top:4px}#message{color:#526384;font-size:14px;white-space:pre-line}#error{color:#b3454c;font-size:13px;white-space:pre-line}a{color:#3865ee;text-decoration:none}code{background:#f1f4f9;padding:4px;border-radius:4px;font-size:13px}#manual{text-align:left}#manual ol{padding-left:22px;color:#6d7990;line-height:1.9;font-size:14px}#timer{font-variant-numeric:tabular-nums;font-size:13px;color:#7a869d}#online{padding:30px 0}.tick{font-size:48px;color:#21a773}@media(max-width:650px){main{margin:24px auto;padding:0 16px}article{padding:20px;gap:12px;flex-wrap:wrap}article .info{min-width:180px}.hero{padding:25px}h1{font-size:26px}.badge{margin-left:66px}dialog{padding:30px 20px}}
</style>
<main><div class="brand">DEEPSENTRY / CONNECTIONS</div><header class="hero"><h1>连接你的通讯工具</h1><p>离开电脑，也能发送任务、查看进度与接收结果。</p></header>
<div id="channels"></div>
<footer>保持 DeepSentry 进程运行。只有授权用户可以发起任务；群聊需要额外配置允许的群。</footer></main>
<dialog id="modal"><button class="close" aria-label="关闭">×</button><div class="mark">↗</div><h2 id="title">连接飞书</h2><p id="subtitle">使用飞书扫码，完成机器人创建与授权</p><div class="tabs" id="tabs"><button id="quickTab" class="active">扫码绑定</button><button id="manualTab" class="secondary">手动配置</button></div>
<div id="quick"><div id="start"><label class="consent"><input id="allow" type="checkbox"><span>允许此账号通过聊天执行 DeepSentry 任务，使用当前配置的工具和目标。未勾选时仅允许查询。</span></label><button id="generate">生成授权二维码</button></div><div id="scan" class="hidden"><img id="qr" alt="平台授权二维码"><p id="scanHelp">打开聊天软件扫一扫，在手机上确认授权</p><p id="timer"></p><a id="authlink" target="_blank" rel="noreferrer">也可以打开授权页面</a><div id="verify" class="hidden"><input id="verifyCode" inputmode="numeric" placeholder="手机显示的验证码"><button id="verifySubmit">继续验证</button></div><p><button id="refresh" class="secondary">重新生成</button></p></div><div id="pairing" class="hidden"><p>在刚创建的机器人私聊中发送这条一次性指令，绑定控制账号：</p><p><code id="pairCommand"></code></p><button id="copyPair" class="secondary">复制配对指令</button></div><div id="online" class="hidden"><div class="tick">✓</div><h2>连接成功</h2><p>打开刚绑定的机器人，发送 <code>/ds help</code> 查看 Agent 仪表盘；之后可直接私聊发任务，例如：</p><p><code>查看系统运行状态</code></p><p><code>/ds run 审计监听端口</code></p></div></div>
<div id="manual" class="hidden"></div><p id="message"></p><p id="error" role="alert"></p></dialog>
<script>
const $=id=>document.getElementById(id),names={feishu:'飞书',qq:'QQ',wechat:'微信',wecom:'企业微信',dingtalk:'钉钉'};
let state={states:{}},pending=false,polling=false,current='feishu',popup=null,popupState='',popupPlatform='';
const labels={unbound:'未连接',waiting_scan:'等待扫码',connecting:'正在连接',connected:'已连接',pairing:'等待账号配对',reconnecting:'重连中',disconnected:'连接已断开',connection_failed:'连接失败',expired:'二维码已过期',denied:'已取消授权',failed:'绑定失败'};
for(const [p,name] of Object.entries(names)){const a=document.createElement('article'),icon=document.createElement('div'),info=document.createElement('div'),h=document.createElement('h2'),desc=document.createElement('p'),badge=document.createElement('span'),btn=document.createElement('button'),off=document.createElement('button');icon.className='icon';icon.textContent=p==='qq'?'Q':name[0];info.className='info';h.textContent=name;desc.textContent=p==='dingtalk'?'连接企业内部应用机器人，通过 HTTP 回调接收指令。':p==='wecom'?'在官方授权窗口扫码创建机器人，再配对控制账号。':'扫码绑定机器人，无需手动填写应用密钥。';info.append(h,desc);badge.className='badge';badge.id='badge-'+p;badge.textContent=p==='dingtalk'?'应用回调':'未连接';btn.textContent=p==='dingtalk'?'配置说明':'立即连接';btn.id='connect-'+p;btn.onclick=()=>p==='dingtalk'?manual(p):openConnection(p);off.className='secondary hidden';off.id='off-'+p;off.textContent='断开连接';off.onclick=()=>disconnect(p);a.append(icon,info,badge,btn,off);$('channels').append(a)}
async function api(action,body={},platform=current){const r=await fetch('./'+action,{method:'POST',headers:{'Content-Type':'application/json','X-DeepSentry-Setup':'1'},body:JSON.stringify({platform,...body})});if(!r.ok)throw Error('请求失败，请重新打开连接窗口');const data=await r.json();if(platform===current){state=data;render();if(data.error){$('error').textContent=data.error;if(data.error.includes('验证码'))$('verify').classList.remove('hidden')}}else{state.states=data.states;renderCards()}return data}
function renderCards(){for(const [p,status] of Object.entries(state.states||{})){const badge=$('badge-'+p);if(!badge)continue;badge.textContent=labels[status]||status;badge.classList.toggle('connected',status==='connected');const live=['connected','pairing','connecting','reconnecting','connection_failed','disconnected'].includes(status);$('off-'+p).classList.toggle('hidden',!live);$('connect-'+p).textContent=live?'查看连接':'立即连接'}}
function render(){renderCards();if(current==='dingtalk')return;const status=state.status||'unbound',live=['connected','pairing','connecting','reconnecting','connection_failed','disconnected'].includes(status);$('message').textContent=labels[status]||status;$('scan').classList.toggle('hidden',!state.qr&&status!=='waiting_scan');$('qr').classList.toggle('hidden',!state.qr);$('start').classList.toggle('hidden',!!state.qr||live||status==='waiting_scan');$('online').classList.toggle('hidden',status!=='connected');$('pairing').classList.toggle('hidden',status!=='pairing');$('pairCommand').textContent=state.pair_command||'';if(state.qr)$('qr').src=state.qr;if(state.url)$('authlink').href=state.url;$('authlink').classList.toggle('hidden',current==='wecom');$('scanHelp').textContent=current==='wecom'?'请在已弹出的企业微信官方窗口扫码并确认授权。':'打开'+names[current]+'扫一扫，在手机上确认授权';if(status==='connection_failed')$('message').textContent='连接失败，请检查网络与平台应用权限。可以断开后重新扫码。';if(['expired','denied','failed'].includes(status)){$('start').classList.remove('hidden');$('scan').classList.add('hidden')}}
function mode(quick){$('quick').classList.toggle('hidden',!quick);$('manual').classList.toggle('hidden',quick);$('quickTab').className=quick?'active':'secondary';$('manualTab').className=quick?'secondary':'active'}
const manuals={feishu:['创建企业自建应用，启用机器人并发布。','选择长连接接收 im.message.receive_v1 事件；授予读取和发送消息权限。','在 config.yaml 的 chat.channels 中配置 platform: feishu_ws、app_id、secret_env、allowed_users。'],qq:['也支持通过 OneBot 11 服务接入已有 QQ 账号。','在 OneBot 服务完成扫码登录，配置 HTTP API、签名和反向 HTTP 上报。','在 config.yaml 配置 platform: onebot、api_url、secret_env、access_token_env 和 QQ 号白名单。'],wechat:['也支持接入已有微信桥接服务。','将消息按接入文档转换成 DeepSentry JSON 格式，设置双向 Bearer Token。','在 config.yaml 配置 platform: wechat、api_url、secret_env、access_token_env 与用户白名单。'],wecom:['也支持使用企业微信自建应用的 XML 回调。','获取 CorpID、AgentID、Secret，设置回调 Token、EncodingAESKey 和可信 IP。','在 config.yaml 配置 platform: wecom、应用凭据环境变量及用户白名单。'],dingtalk:['创建支持 HTTP 接收消息的企业内部应用机器人。','把消息接收地址设为公开 HTTPS 地址 /chat/通道名，配置应用 Secret。','在 config.yaml 配置 platform: dingtalk、secret_env、allowed_users；群聊还需 allowed_chats。']};
function manual(p){current=p;$('title').textContent='连接'+names[p];$('subtitle').textContent='按平台要求完成连接配置';$('tabs').classList.toggle('hidden',p==='dingtalk');$('manual').replaceChildren();const ol=document.createElement('ol');manuals[p].forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.append(li)});$('manual').append(ol);const note=document.createElement('p');note.textContent='完整示例见 docs/聊天机器人接入.md。保存配置后重启聊天服务。';$('manual').append(note);mode(false);$('message').textContent='';$('error').textContent='';if(!$('modal').open)$('modal').showModal()}
function openConnection(p){current=p;state={states:state.states,status:state.states[p]||'unbound'};$('title').textContent='连接'+names[p];$('subtitle').textContent='扫码授权，连接你的 DeepSentry';$('tabs').classList.remove('hidden');$('verify').classList.add('hidden');$('error').textContent='';mode(true);render();$('modal').showModal();api('status').catch(e=>$('error').textContent=e.message)}
$('manualTab').onclick=()=>manual(current);$('quickTab').onclick=()=>{mode(true);render()};
async function begin(){if(pending)return;pending=true;$('generate').disabled=$('refresh').disabled=true;$('error').textContent='';const platform=current;if(platform==='wecom'){if(popup&&!popup.closed)popup.close();popup=window.open('about:blank','DeepSentryWecomAuth','width=950,height=640');if(!popup){$('error').textContent='请允许浏览器弹窗后重试';pending=false;$('generate').disabled=$('refresh').disabled=false;return}}try{const data=await api('begin',{allow_batch:$('allow').checked},platform);if(platform==='wecom'){if(data.error){popup.close()}else{popupState=data.state;popupPlatform=platform;popup.location=data.url}}}catch(e){$('error').textContent=e.message;if(popup)popup.close()}finally{pending=false;$('generate').disabled=$('refresh').disabled=false}}
window.addEventListener('message',async e=>{if(e.origin!=='https://work.weixin.qq.com'||!popup||e.source!==popup||popupPlatform!=='wecom'||!popupState)return;const data=e.data;if(!data||typeof data!=='object')return;if(data.type==='AUTH_SUCCESS'){const b=data.payload||{};if(typeof b.botid!=='string'||typeof b.secret!=='string'){$('error').textContent='企业微信未返回完整机器人凭据';return}const stateToken=popupState;popupState='';try{await api('wecom-complete',{state:stateToken,botid:b.botid,secret:b.secret},'wecom')}catch(err){$('error').textContent=err.message}popup.close();popup=null}else if(['AUTH_ERROR','AUTH_CANCEL','WINDOW_CLOSE'].includes(data.type)){popupState='';popup.close();popup=null;api('cancel',{},'wecom').catch(()=>{});$('error').textContent='企业微信授权未完成，请重试。如平台提示 source 未开通，请配置企业微信分配的来源标识。'}});
$('generate').onclick=begin;$('refresh').onclick=begin;$('verifySubmit').onclick=()=>api('poll',{verify_code:$('verifyCode').value}).catch(e=>$('error').textContent=e.message);$('copyPair').onclick=()=>navigator.clipboard.writeText($('pairCommand').textContent).then(()=>{$('copyPair').textContent='已复制'}).catch(()=>{$('error').textContent='请手动复制配对指令'});
async function disconnect(p){if(!confirm('断开'+names[p]+'连接并停止该平台正在执行的任务？'))return;try{await api('disconnect',{},p)}catch(e){alert(e.message)}}
function close(){if(state.status==='waiting_scan')api('cancel').catch(()=>{});if(popup){popupState='';popup.close();popup=null}$('modal').close()}document.querySelector('.close').onclick=close;$('modal').addEventListener('cancel',e=>{e.preventDefault();close()});
setInterval(async()=>{const left=Math.max(0,(state.expires_at||0)-Math.floor(Date.now()/1000));$('timer').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' 后过期';if(pending||polling)return;polling=true;try{await api(state.status==='waiting_scan'?'poll':'status')}catch(e){$('error').textContent=e.message}finally{polling=false}},2000);api('status').catch(()=>{});
</script></html>
